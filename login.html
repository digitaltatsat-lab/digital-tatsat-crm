
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Digital TATSAT CRM</title>

  <style>
    :root {
      --navy: #10294d;
      --blue: #2463eb;
      --background: #f4f7fc;
      --text: #182b46;
      --muted: #6a7890;
      --border: #dce4ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--background);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 15px 45px rgba(16,41,77,.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      margin: 0;
      color: var(--navy);
      font-size: 28px;
      font-weight: 800;
    }

    .brand p {
      color: var(--muted);
      font-size: 14px;
      margin: 10px 0 0;
    }

    h2 {
      font-size: 21px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 26px;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .field {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(36,99,235,.1);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 75px;
    }

    .toggle {
      position: absolute;
      right: 8px;
      top: 7px;
      border: none;
      background: #eef3ff;
      color: var(--navy);
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
    }

    .login-button {
      width: 100%;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      min-height: 22px;
      margin: 15px 0;
      font-size: 13px;
      color: #c62828;
      text-align: center;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="brand">
      <h1>Digital TATSAT</h1>
      <p>Customer Relationship Management</p>
    </div>

    <h2>Welcome Back</h2>

    <p class="subtitle">
      Sign in to access your CRM dashboard.
      Admin and employee accounts are supported.
    </p>

    <form id="loginForm">

      <div class="field">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <div class="password-box">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="toggle"
            id="togglePassword">
            Show
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="login-button"
        id="loginButton">
        Sign In
      </button>

      <div
        class="message"
        id="message"
        role="alert"
        aria-live="polite">
      </div>

    </form>

    <div class="footer">
      Digital TATSAT CRM V4
      <p>Secure Admin & Employee Access</p>
    </div>

  </div>

  <script>
    "use strict";

    const passwordInput =
      document.getElementById("password");

    const togglePassword =
      document.getElementById("togglePassword");

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    togglePassword.addEventListener("click", function () {
      const visible = passwordInput.type === "text";

      passwordInput.type = visible
        ? "password"
        : "text";

      this.textContent = visible
        ? "Show"
        : "Hide";
    });

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";
      message.textContent = "";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: passwordInput.value
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.error ||
            result.message ||
            "Login failed."
          );
        }

        if (
          result.redirect !== "/dashboard" &&
          result.redirect !== "/employee-dashboard"
        ) {
          throw new Error("Invalid dashboard redirect.");
        }

        window.location.assign(result.redirect);

      } catch (error) {
        message.textContent =
          error.message || "Unable to sign in.";

      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Sign In";
      }
    });
  </script>

</body>
</html>
